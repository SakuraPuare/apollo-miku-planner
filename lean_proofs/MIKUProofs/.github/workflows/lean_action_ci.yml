name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_proofs/MIKUProofs
      - name: Verify paper certificates and implementation links
        run: cd lean_proofs/MIKUProofs && ./verify_all.sh
